<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar no bunker</title>
<style>
body{margin:0;background:#141414;display:flex;justify-content:center}
@keyframes pisca{0%,100%{opacity:1}50%{opacity:.35}}
.pisca{animation:pisca 1.8s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #141414; color: #F5F5F5; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column">
<div aria-hidden="true" style="height: 10px; flex: none; background-image: linear-gradient(-45deg, #FFD400 25%, #141414 25%, #141414 50%, #FFD400 50%, #FFD400 75%, #141414 75%); background-size: 28px 28px"></div>
<main style="flex: 1; display: flex; flex-direction: column; align-items: center; padding: 0 24px">
<svg aria-hidden="true" class="" width="112" height="112" viewBox="0 0 320 320" style="margin-top: 36px">
<g transform="rotate(25 160 160)">
<g fill="none" stroke="#FFD400" stroke-linecap="round" stroke-linejoin="round">
<path d="M150 78 Q 122 40 92 52" stroke-width="7"/>
<path d="M170 78 Q 198 40 228 52" stroke-width="7"/>
<g stroke-width="9">
<polyline points="120,138 88,124 74,98"/>
<polyline points="112,172 74,174 54,190"/>
<polyline points="120,206 90,226 82,256"/>
<polyline points="200,138 232,124 246,98"/>
<polyline points="208,172 246,174 266,190"/>
<polyline points="200,206 230,226 238,256"/>
</g>
</g>
<circle cx="160" cy="92" r="24" fill="#FFD400"/>
<ellipse cx="160" cy="176" rx="52" ry="74" fill="#FFD400"/>
</g>
<polygon points="141,152.5 141,196.5 179,174.5" fill="#141414" stroke="#141414" stroke-width="8" stroke-linejoin="round"/>
</svg>
<div style="margin-top: 4px; font-size: 40px; font-weight: 700; line-height: 1.1; letter-spacing: -1.5px">doomscroll</div>
<p style="margin: 6px 0 0; font-size: 15px; line-height: 1.4; color: #B0B0B0">Vídeos curtos para o fim do mundo.</p>
<div style="margin-top: 14px; padding: 6px 12px; border: 1px solid #3A3A3A; border-radius: 999px; display: flex; align-items: center; gap: 8px; font-size: 13px">
<span aria-hidden="true" class="pisca" style="width: 8px; height: 8px; border-radius: 50%; background: #FFD400"></span>Bunker no ar
</div>
<form style="position: relative; align-self: stretch; margin-top: 24px; padding: 24px 20px; background: #262626; border: 1px solid #3A3A3A; border-radius: 16px; display: flex; flex-direction: column">
<span aria-hidden="true" style="position: absolute; left: 10px; top: 10px; width: 8px; height: 8px; border-radius: 50%; background: #5A5A5A"></span><span aria-hidden="true" style="position: absolute; right: 10px; top: 10px; width: 8px; height: 8px; border-radius: 50%; background: #5A5A5A"></span><span aria-hidden="true" style="position: absolute; left: 10px; bottom: 10px; width: 8px; height: 8px; border-radius: 50%; background: #5A5A5A"></span><span aria-hidden="true" style="position: absolute; right: 10px; bottom: 10px; width: 8px; height: 8px; border-radius: 50%; background: #5A5A5A"></span>
<h1 style="margin: 0 0 16px; font-size: 22px; font-weight: 700; line-height: 1.2">Quem vem lá?</h1>
<label for="apelido" style="font-size: 14px; font-weight: 700">Apelido</label>
<input id="apelido" type="text" autocomplete="username" placeholder="Como te chamam por aqui" style="margin-top: 6px; height: 48px; box-sizing: border-box; padding: 0 14px; background: #141414; border: 1px solid #5A5A5A; border-radius: 12px; color: #F5F5F5; font: inherit; font-size: 15px">
<fieldset style="margin: 16px 0 0; padding: 0; border: 0">
<legend style="padding: 0; font-size: 14px; font-weight: 700">PIN de 4 números</legend>
<div style="margin-top: 6px; display: flex; gap: 10px"><input aria-label="Número 1 do PIN" type="password" inputmode="numeric" maxlength="1" style="width: 56px; height: 56px; box-sizing: border-box; background: #141414; border: 1px solid #5A5A5A; border-radius: 12px; color: #F5F5F5; font: inherit; font-size: 24px; font-weight: 700; text-align: center"><input aria-label="Número 2 do PIN" type="password" inputmode="numeric" maxlength="1" style="width: 56px; height: 56px; box-sizing: border-box; background: #141414; border: 1px solid #5A5A5A; border-radius: 12px; color: #F5F5F5; font: inherit; font-size: 24px; font-weight: 700; text-align: center"><input aria-label="Número 3 do PIN" type="password" inputmode="numeric" maxlength="1" style="width: 56px; height: 56px; box-sizing: border-box; background: #141414; border: 1px solid #5A5A5A; border-radius: 12px; color: #F5F5F5; font: inherit; font-size: 24px; font-weight: 700; text-align: center"><input aria-label="Número 4 do PIN" type="password" inputmode="numeric" maxlength="1" style="width: 56px; height: 56px; box-sizing: border-box; background: #141414; border: 1px solid #5A5A5A; border-radius: 12px; color: #F5F5F5; font: inherit; font-size: 24px; font-weight: 700; text-align: center"></div>
</fieldset>
<button type="submit" style="margin-top: 20px; height: 52px; background: #FFD400; color: #141414; border: 0; border-radius: 12px; font: inherit; font-size: 16px; font-weight: 700">Entrar</button>
</form>
<p style="margin: 16px 0 0; font-size: 13px; line-height: 1.45; color: #B0B0B0; text-align: center">Primeira vez por aqui? Escolha um apelido e um PIN. Sua vaga no bunker é criada na hora.</p>
</main>
</div>
</body>
</html>
