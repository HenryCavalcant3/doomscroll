<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Você zerou a internet</title>
<style>
body{margin:0;background:#141414;display:flex;justify-content:center}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes desce{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}
.gira{transform-box:fill-box;transform-origin:center;animation:gira 24s linear infinite}
.desce{animation:desce 1.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #141414; color: #F5F5F5; font-family: 'Space Grotesk', system-ui, sans-serif; display: flex; flex-direction: column">
<div aria-hidden="true" style="height: 10px; flex: none; background-image: linear-gradient(-45deg, #FFD400 25%, #141414 25%, #141414 50%, #FFD400 50%, #FFD400 75%, #141414 75%); background-size: 28px 28px"></div>
<main style="flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 0 24px">
<div style="margin-top: 28px; padding: 6px 12px; border: 1px solid #FFD400; border-radius: 999px; color: #FFD400; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase">Fim do acervo</div>
<div style="position: relative; width: 200px; height: 200px; margin-top: 24px">
<svg aria-hidden="true" width="200" height="200" viewBox="0 0 200 200" style="position: absolute; inset: 0">
<circle class="gira" cx="100" cy="100" r="94" fill="none" stroke="#FFD400" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 14"/>
<circle cx="100" cy="100" r="78" fill="#262626"/>
</svg>
<svg aria-hidden="true" class="" width="136" height="136" viewBox="0 0 320 320" style="position: absolute; left: 32px; top: 32px">
<g transform="rotate(25 160 160)">
<g fill="none" stroke="#FFD400" stroke-linecap="round" stroke-linejoin="round">
<path d="M150 78 Q 122 40 92 52" stroke-width="7"/>
<path d="M170 78 Q 198 40 228 52" stroke-width="7"/>
<g stroke-width="9">
<polyline points="120,138 88,124 74,98"/>
<polyline points="112,172 74,174 54,190"/>
<polyline points="120,206 90,226 82,256"/>
<polyline points="200,138 232,124 246,98"/>
<polyline points="208,172 246,174 266,190"/>
<polyline points="200,206 230,226 238,256"/>
</g>
</g>
<circle cx="160" cy="92" r="24" fill="#FFD400"/>
<ellipse cx="160" cy="176" rx="52" ry="74" fill="#FFD400"/>
</g>
<polygon points="141,152.5 141,196.5 179,174.5" fill="#141414" stroke="#141414" stroke-width="8" stroke-linejoin="round"/>
</svg>
</div>
<h1 style="margin: 24px 0 8px; font-size: 34px; font-weight: 700; line-height: 1.05; letter-spacing: -1px">Você zerou a internet.</h1>
<p style="margin: 0; font-size: 16px; line-height: 1.4; color: #B0B0B0">Pelo menos a parte que coube no bunker.</p>
<div style="margin-top: 24px; padding: 16px 24px; background: #262626; border: 1px solid #3A3A3A; border-radius: 16px; display: flex; align-items: center; gap: 16px; text-align: left">
<div style="font-size: 64px; font-weight: 700; line-height: 1; color: #FFD400; letter-spacing: -2px">47</div>
<div>
<div style="font-size: 16px; font-weight: 700; line-height: 1.3">vídeos vistos</div>
<div style="font-size: 14px; line-height: 1.3; color: #B0B0B0">nesta volta</div>
</div>
</div>
<div style="flex: 1"></div>
<svg aria-hidden="true" class="desce" width="32" height="32" viewBox="0 0 32 32">
<polyline points="8,8 16,16 24,8" fill="none" stroke="#FFD400" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="8,18 16,26 24,18" fill="none" stroke="#FFD400" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<div style="margin-top: 8px; font-size: 15px; font-weight: 700">Role para continuar</div>
<p style="margin: 4px 0 20px; font-size: 13px; line-height: 1.4; color: #B0B0B0">Os vídeos voltam a circular a partir daqui.</p>
</main>
<nav style="height: 64px; flex: none; display: flex; border-top: 1px solid #3A3A3A">
<button style="flex: 1; background: none; border: 0; color: #FFD400; font: inherit; font-size: 13px; font-weight: 700">Feed</button>
<button style="flex: 1; background: none; border: 0; color: #F5F5F5; font: inherit; font-size: 13px">Adicionar</button>
<button style="flex: 1; background: none; border: 0; color: #F5F5F5; font: inherit; font-size: 13px">Mensagens</button>
<button style="flex: 1; background: none; border: 0; color: #F5F5F5; font: inherit; font-size: 13px">Perfil</button>
</nav>
</div>
</body>
</html>
