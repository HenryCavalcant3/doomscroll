<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wireframe: Adicionar vídeo</title>
<style>body{margin:0;background:#141414;display:flex;justify-content:center}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #141414; color: #F5F5F5; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column">
<div style="flex: 1; padding: 24px 20px; display: flex; flex-direction: column; gap: 24px">
<h1 style="margin: 0; font-size: 24px; font-weight: 700">Adicionar vídeo</h1>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="link" style="font-size: 14px; font-weight: 700">Link do vídeo</label>
<input id="link" type="url" placeholder="Cole o link (Shorts, TikTok)" style="height: 48px; box-sizing: border-box; padding: 0 14px; background: #262626; border: 1px solid #5A5A5A; border-radius: 10px; color: #F5F5F5; font: inherit; font-size: 15px">
<button style="height: 48px; background: #FFD400; color: #141414; border: 0; border-radius: 10px; font: inherit; font-size: 15px; font-weight: 700">Baixar para o bunker</button>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; background: #262626; border-radius: 12px">
<div style="font-size: 14px; font-weight: 700">Processamento</div>
<div style="display: flex; justify-content: space-between; font-size: 14px"><span>Baixando</span><span style="color: #FFD400">feito</span></div>
<div style="display: flex; justify-content: space-between; font-size: 14px"><span>Convertendo</span><span style="color: #FFD400">feito</span></div>
<div style="display: flex; justify-content: space-between; font-size: 14px"><span>Transcrevendo</span><span style="color: #F5F5F5">em andamento</span></div>
<div style="display: flex; justify-content: space-between; font-size: 14px; color: #B0B0B0"><span>Sugerindo tópicos</span><span>na fila</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 14px; font-weight: 700">Tópicos sugeridos pela IA</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button style="height: 44px; padding: 0 16px; background: #FFD400; color: #141414; border: 0; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 700">humor</button>
<button style="height: 44px; padding: 0 16px; background: #FFD400; color: #141414; border: 0; border-radius: 999px; font: inherit; font-size: 14px; font-weight: 700">animais</button>
<button style="height: 44px; padding: 0 16px; background: none; color: #F5F5F5; border: 1px solid #F5F5F5; border-radius: 999px; font: inherit; font-size: 14px">dicas</button>
<button style="height: 44px; padding: 0 16px; background: none; color: #F5F5F5; border: 1px dashed #B0B0B0; border-radius: 999px; font: inherit; font-size: 14px">+ tópico</button>
</div>
</div>
<div style="font-size: 13px; line-height: 1.4; color: #B0B0B0">Depois de confirmar, o vídeo fica pendente até o dono do bunker aprovar.</div>
<button style="height: 48px; background: none; color: #F5F5F5; border: 1px solid #F5F5F5; border-radius: 10px; font: inherit; font-size: 15px; font-weight: 700">Confirmar tópicos</button>
</div>
<nav style="height: 64px; display: flex; border-top: 1px solid #3A3A3A">
<button style="flex: 1; background: none; border: 0; color: #F5F5F5; font: inherit; font-size: 13px">Feed</button>
<button style="flex: 1; background: none; border: 0; color: #FFD400; font: inherit; font-size: 13px; font-weight: 700">Adicionar</button>
<button style="flex: 1; background: none; border: 0; color: #F5F5F5; font: inherit; font-size: 13px">Mensagens</button>
<button style="flex: 1; background: none; border: 0; color: #F5F5F5; font: inherit; font-size: 13px">Perfil</button>
</nav>
</div>
</body>
</html>
