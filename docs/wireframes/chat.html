<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wireframe: Chat</title>
<style>body{margin:0;background:#141414;display:flex;justify-content:center}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #141414; color: #F5F5F5; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column">
<header style="height: 68px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #3A3A3A">
<button aria-label="Voltar" style="width: 44px; height: 44px; background: none; border: 0; padding: 0; color: #F5F5F5">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24"><polyline points="15,5 8,12 15,19" fill="none" stroke="#F5F5F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>
</button>
<div aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; background: #3A3A3A"></div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 16px; font-weight: 700">Tio Valdir</div>
<div style="font-size: 12px; color: #FFD400">persona de IA · digitando...</div>
</div>
</header>
<div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="align-self: flex-start; max-width: 260px; padding: 10px 14px; background: #262626; border-radius: 16px; font-size: 15px; line-height: 1.35">Bom dia, sobreviventes! Olha esse aqui que eu achei.</div>
<div style="align-self: flex-start; display: flex; flex-direction: column; gap: 6px">
<div style="width: 140px; height: 200px; background: #262626; border: 1px solid #5A5A5A; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #B0B0B0; font-size: 13px">
<svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24"><polygon points="7,4 7,20 20,12" fill="none" stroke="#B0B0B0" stroke-width="1.5" stroke-linejoin="round"></polygon></svg>
vídeo compartilhado
</div>
<button style="align-self: flex-start; height: 44px; padding: 0 14px; background: none; border: 1px dashed #B0B0B0; border-radius: 999px; color: #F5F5F5; font: inherit; font-size: 13px">+ reagir</button>
</div>
<div style="align-self: flex-end; max-width: 260px; padding: 10px 14px; background: #FFD400; color: #141414; border-radius: 16px; font-size: 15px; line-height: 1.35">Esse eu já tinha visto no feed, tio.</div>
<div style="align-self: flex-end; display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
<div style="width: 140px; height: 200px; background: #262626; border: 1px solid #FFD400; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #B0B0B0; font-size: 13px">
<svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24"><polygon points="7,4 7,20 20,12" fill="none" stroke="#B0B0B0" stroke-width="1.5" stroke-linejoin="round"></polygon></svg>
vídeo que você enviou
</div>
<div style="padding: 4px 12px; background: #262626; border: 1px solid #5A5A5A; border-radius: 999px; font-size: 13px">reação do Tio Valdir</div>
</div>
</div>
<div style="height: 72px; box-sizing: border-box; padding: 12px; display: flex; gap: 8px; border-top: 1px solid #3A3A3A">
<button aria-label="Enviar vídeo do feed" style="width: 48px; height: 48px; background: #262626; border: 1px solid #5A5A5A; border-radius: 10px; padding: 0">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24"><polygon points="7,4 7,20 20,12" fill="none" stroke="#F5F5F5" stroke-width="1.8" stroke-linejoin="round"></polygon></svg>
</button>
<label for="msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Mensagem</label>
<input id="msg" type="text" placeholder="Mensagem" style="flex: 1; min-width: 0; height: 48px; box-sizing: border-box; padding: 0 14px; background: #262626; border: 1px solid #5A5A5A; border-radius: 10px; color: #F5F5F5; font: inherit; font-size: 15px">
<button style="height: 48px; padding: 0 16px; background: #FFD400; color: #141414; border: 0; border-radius: 10px; font: inherit; font-size: 15px; font-weight: 700">Enviar</button>
</div>
</div>
</body>
</html>
