<!doctype html>
<html lang="pt-BR">
<head>

<title>Wireframe: Feed</title>
<style>body{margin:0;background:#141414;display:flex;justify-content:center}</style>

<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #141414; color: #F5F5F5; font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column">

<div style="font-size: 14px">vídeo em tela cheia, autoplay</div>
</div>

curtir

</button>

<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-7z" fill="none" stroke="#F5F5F5" stroke-width="1.8" stroke-linejoin="round"></path></svg>

<div style="position: absolute; left: 16px; right: 84px; bottom: 28px; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 15px; font-weight: 700">@quem_enviou</div>
<div style="font-size: 14px; line-height: 1.35">Descrição curta gerada pela IA na ingestão.</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<span style="font-size: 12px; padding: 4px 10px; border: 1px solid #F5F5F5; border-radius: 999px">humor</span>
<span style="font-size: 12px; padding: 4px 10px; border: 1px solid #F5F5F5; border-radius: 999px">dicas</span>

<button style="flex: 1; background: none; border: 0; color: #F5F5F5; font: inherit; font-size: 13px">Adicionar</button>
