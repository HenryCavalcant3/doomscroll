server {
  listen 80;
  root /usr/share/nginx/html;

  # A api fica atrás do mesmo endereço: /api/* -> api:3000/*
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
  }

  # Os arquivos de assets/ têm hash no nome e podem ficar em cache para sempre.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # O mime.types do nginx não conhece .webmanifest.
  location = /manifest.webmanifest {
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache";
  }

  # O index.html é sempre revalidado, senão o celular continua com a versão antiga depois de um deploy.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
