name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: SVGs válidos (logo e avatares)
        run: |
          python3 - <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET
          bad = 0
          for f in sorted(glob.glob("docs/**/*.svg", recursive=True) + glob.glob("personas/**/*.svg", recursive=True)):
              try:
                  ET.parse(f)
              except ET.ParseError as e:
                  print(f"::error file={f}::SVG inválido: {e}")
                  bad += 1
          sys.exit(1 if bad else 0)
          EOF
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  docker:
    name: Build das imagens
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Só as imagens do projeto. Os modelos do Ollama nunca são baixados no CI.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
